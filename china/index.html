    const LOOKUP_SALT = 'I6hsnoqB4qfi2JsvJLQs6A==';
    const ITERATIONS = 100000;
    
    // Crypto utilities using Web Crypto API
    async function deriveKey(password, salt, usage) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits', 'deriveKey']
      );
      
      if (usage === 'hash') {
        const bits = await crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: encoder.encode(salt), iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial, 256
        );
        return btoa(String.fromCharCode(...new Uint8Array(bits)));
      }
      
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: base64ToArray(salt), iterations: ITERATIONS, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }
    
    function base64ToArray(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    
    async function decrypt(entry, password) {
      try {
        const key = await deriveKey(password, entry.salt, 'decrypt');
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: base64ToArray(entry.iv), tagLength: 128 },
          key,
          concatArrays(base64ToArray(entry.ciphertext), base64ToArray(entry.authTag))
        );
        return JSON.parse(new TextDecoder().decode(decrypted));
      } catch {
        return null;
      }
    }
    
    function concatArrays(a, b) {
      const result = new Uint8Array(a.length + b.length);
      result.set(a, 0);
      result.set(b, a.length);
      return result;
    }
    
    async function unlock() {
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit');
      const errorEl = document.getElementById('error');
      
      if (!password) return;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      errorEl.classList.remove('show');
      
      try {
        // Hash password to find matching entry
        const hash = await deriveKey(password, LOOKUP_SALT, 'hash');
        const entry = ENTRIES.find(e => e.hash === hash);
        
        if (!entry) {
          throw new Error('Invalid password. Please check and try again.');
        }
        
        // Decrypt the payload
        const payload = await decrypt(entry, password);
        if (!payload) {
          throw new Error('Invalid password. Please check and try again.');
        }
        
        // Check expiration
        const expires = new Date(payload.expires + 'T23:59:59');
        if (new Date() > expires) {
          document.getElementById('login').style.display = 'none';
          document.getElementById('expired').style.display = 'flex';
          logAccess(payload.investor, 'expired');
          return;
        }
        
        // Success - show content
        logAccess(payload.investor, 'success');
        document.getElementById('login').style.display = 'none';
        document.getElementById('content').innerHTML = payload.content;
        document.getElementById('content').style.display = 'block';

        // Re-execute scripts (innerHTML doesn't run them)
        const scripts = document.getElementById('content').querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Access Document';
        logAccess('unknown', 'failed');
      }
    }
    
    // Optional: beacon access attempts (replace URL with your endpoint)
    function logAccess(investor, status) {
      const data = {
        investor,
        status,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      };
      // Uncomment and set your logging endpoint:
      // navigator.sendBeacon('https://your-api.com/log', JSON.stringify(data));
      console.log('Access:', data);
    }
    
    // Enter key submits
    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') unlock();
    });
  </script>
</body>
</html>
